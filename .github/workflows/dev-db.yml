name: Dev database

# Applies committed migrations to the HeyQR dev database (used by Vercel Preview deployments) before they use it.
# Runs on pull requests that change the schema or migrations, and on demand. One run at a time;
# db:migrate also takes a Postgres advisory lock, so overlapping runs from elsewhere are serialised too.
on:
  pull_request:
    paths: ["drizzle/**", "src/server/db/**"]
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load the demo fixtures (safe to rerun)"
        type: boolean
        default: false

concurrency:
  group: dev-database
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: dev
    env:
      APP_ENV: dev
      # Secrets of the GitHub "dev" environment: the Neon dev branch's pooled and direct connection strings,
      # the same database Vercel's Preview scope uses.
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DEV_DATABASE_URL_UNPOOLED }}
    steps:
      - name: Check the dev database is configured
        id: configured
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DEV_DATABASE_URL is not set in the GitHub 'dev' environment, so dev migrations are skipped. See docs/ENVIRONMENTS.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm db:migrate
      - if: steps.configured.outputs.ready == 'true' && inputs.seed
        run: pnpm db:seed
      - if: steps.configured.outputs.ready == 'true'
        run: pnpm db:verify
