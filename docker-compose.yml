services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heyqr
      POSTGRES_PASSWORD: heyqr
      POSTGRES_DB: heyqr
    ports:
      - "5432:5432"
    volumes:
      - heyqr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heyqr"]
      interval: 5s
      retries: 10
  minio:
    # Local S3-compatible storage for logo uploads and export cache.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: heyqr
      MINIO_ROOT_PASSWORD: heyqr-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - heyqr-s3:/data
volumes:
  heyqr-db:
  heyqr-s3:
